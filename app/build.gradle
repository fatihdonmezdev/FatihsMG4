plugins {
    alias(libs.plugins.android.application)
}

android {
    namespace 'com.evsuite.abrp'
    compileSdk {
        version = release(36) {
            minorApiLevel = 1
        }
    }

    def keystorePath = System.getenv("SIGNING_KEYSTORE") ?: project.findProperty("signing.keystore")
    signingConfigs {
        if (keystorePath != null && file(keystorePath).exists()) {
            platform {
                storeFile     file(keystorePath)
                storePassword System.getenv("SIGNING_STORE_PASSWORD") ?: project.findProperty("signing.store.password")
                keyAlias      System.getenv("SIGNING_KEY_ALIAS") ?: project.findProperty("signing.key.alias") ?: "platform"
                keyPassword   System.getenv("SIGNING_KEY_PASSWORD") ?: project.findProperty("signing.key.password")
            }
        }
    }

    defaultConfig {
        applicationId "com.evsuite.abrp"
        minSdk 27
        targetSdk 36
        versionCode 61
        versionName "2.2.46"

        ndk {
            abiFilters "arm64-v8a"
        }

        buildConfigField "String", "CONSUMPTION_API_URL", "\"${System.getenv('CONSUMPTION_API_URL') ?: project.findProperty('consumption.api.url') ?: 'https://mg-web-app-eta.vercel.app'}\""
        buildConfigField "String", "CONSUMPTION_API_TOKEN", "\"${System.getenv('CONSUMPTION_API_TOKEN') ?: project.findProperty('consumption.api.token') ?: '066da6fc58a0fcd8a35deccb29e43ef7a0b3bcda5a3c2b99db86e64a5b982ec6'}\""

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    def platformSigning = signingConfigs.findByName("platform")

    flavorDimensions += ["user", "channel"]

    productFlavors {
        fatih {
            dimension "user"
            buildConfigField "String", "CONSUMPTION_INSTALLATION_ID", "\"226b1614-4d18-48f0-8938-3609cfa3db93\""
            buildConfigField "String", "APK_PREFIX", "\"FatihsMG4\""
            buildConfigField "String", "OTA_CHANNEL_TAG", "\"unstable\""
        }
        sami {
            dimension "user"
            applicationIdSuffix ".sami"
            buildConfigField "String", "CONSUMPTION_INSTALLATION_ID", "\"Sami\""
            buildConfigField "String", "APK_PREFIX", "\"SamisMG4\""
            buildConfigField "String", "OTA_CHANNEL_TAG", "\"sami-unstable\""
        }
        stable {
            dimension "channel"
            buildConfigField "boolean", "OTA_ENABLED", "false"
        }
        unstable {
            dimension "channel"
            applicationIdSuffix ".unstable"
            versionCode defaultConfig.versionCode * 100000 +
                    (project.findProperty('unstableBuild') ?: '0').toString().toInteger()
            versionName "${defaultConfig.versionName}"
            versionNameSuffix "-unstable"
            buildConfigField "boolean", "OTA_ENABLED", "true"
        }
    }

    buildTypes {
        debug {
            if (platformSigning != null) signingConfig platformSigning
        }
        release {
            minifyEnabled true
            if (platformSigning != null) signingConfig platformSigning
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    sourceSets {
        test {
            java {
                exclude '**/TelemetryPayloadTest.java'
                exclude '**/ChargingSignalTest.java'
                exclude '**/AbrpApiTest.java'
                exclude '**/ConfigImportTest.java'
                exclude '**/UploadCadenceTest.java'
                exclude '**/UploadLogTest.java'
                exclude '**/HeadUnitWeatherTest.java'
            }
        }
    }
    buildFeatures {
        buildConfig true
        resValues true
    }

    lint {
        abortOnError true
        checkReleaseBuilds true
        warningsAsErrors false
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }
}

tasks.register('printUnstableVersion') {
    doLast {
        println "${android.defaultConfig.versionName}.${project.findProperty('unstableBuild') ?: '0'}"
    }
}

dependencies {
    implementation project(':evhardware')
    implementation libs.appcompat
    implementation libs.material
    implementation libs.activity
    implementation libs.constraintlayout
    implementation libs.viewpager2
    implementation libs.security.crypto
    implementation 'com.google.zxing:core:3.5.3'
    implementation 'org.videolan.android:libvlc-all:3.6.0'
    testImplementation libs.junit
    testImplementation libs.json
    androidTestImplementation libs.ext.junit
    androidTestImplementation libs.espresso.core
}
